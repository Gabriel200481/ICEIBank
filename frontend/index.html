<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICEIBank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topo">
    <span class="marca">ICEIBank</span>
    <div class="rota">
      <label for="baseUrl">agência</label>
      <select id="baseUrl">
        <option value="http://localhost:4000">0 — localhost:4000</option>
        <option value="http://localhost:4001">1 — localhost:4001</option>
        <option value="http://localhost:4002">2 — localhost:4002</option>
      </select>
    </div>
  </header>

  <div id="mensagem" class="mensagem" hidden role="alert"></div>

  <main>
    <section id="secao-login" class="acesso">
      <div class="acesso-painel">
        <p class="acesso-rotulo">acesso ao terminal</p>
        <form id="form-login">
          <label>usuário
            <input type="text" id="login-usuario" value="aluno" required />
          </label>
          <label>senha
            <input type="password" id="login-senha" value="senha123" required />
          </label>
          <button type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <section id="secao-app" class="livro" hidden>
      <p class="sessao">
        <span id="usuario-logado"></span> em <span id="agencia-logada"></span>
        <button id="botao-logout" class="link">sair</button>
      </p>

      <article class="lancamento">
        <span class="codigo">NEW</span>
        <div class="corpo">
          <h2>Criar conta</h2>
          <form id="form-criar-conta">
            <label>ID da conta <input type="number" id="criar-id" min="0" required /></label>
            <label>Nome do titular <input type="text" id="criar-nome" required /></label>
            <label>Saldo inicial <input type="number" id="criar-saldo" value="0" min="0" step="0.01" /></label>
            <button type="submit">Criar conta</button>
          </form>
        </div>
      </article>

      <article class="lancamento">
        <span class="codigo">BAL</span>
        <div class="corpo">
          <h2>Consultar saldo</h2>
          <form id="form-saldo">
            <label>ID da conta <input type="number" id="saldo-id" min="0" required /></label>
            <button type="submit">Consultar</button>
          </form>
          <p id="resultado-saldo" class="resultado"></p>
        </div>
      </article>

      <article class="lancamento">
        <span class="codigo">MOV</span>
        <div class="corpo">
          <h2>Depositar / sacar</h2>
          <form id="form-deposito-saque">
            <label>ID da conta <input type="number" id="ds-id" min="0" required /></label>
            <label>Valor <input type="number" id="ds-valor" min="0.01" step="0.01" required /></label>
            <div class="botoes">
              <button type="submit" data-acao="depositar" class="credito">Depositar</button>
              <button type="submit" data-acao="sacar" class="debito">Sacar</button>
            </div>
          </form>
        </div>
      </article>

      <article class="lancamento">
        <span class="codigo">XFR</span>
        <div class="corpo">
          <h2>Transferir</h2>
          <form id="form-transferencia">
            <label>Conta origem <input type="number" id="tr-origem" min="0" required /></label>
            <label>Conta destino <input type="number" id="tr-destino" min="0" required /></label>
            <label>Valor <input type="number" id="tr-valor" min="0.01" step="0.01" required /></label>
            <button type="submit">Transferir</button>
          </form>
          <p class="dica">Local ou entre agências — o backend decide, pelo id da conta de destino.</p>
        </div>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
